<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My First Vercel App</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, "Noto Sans KR", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f8fa;
        color: #111827;
      }

      main {
        width: min(92vw, 560px);
        padding: 40px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        background: #ffffff;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      p {
        margin: 0;
        color: #57606a;
        font-size: 18px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello Vercel!</h1>
      <p>GitHub 저장소 연결과 첫 배포를 위한 테스트 페이지입니다.</p>
    </main>
  </body>
</html>
