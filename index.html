  <style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,

.leaflet-tile::selection {

.leaflet-marker-shadow {

/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;

.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {

	max-height: none !important;

	}

.leaflet-container img.leaflet-tile {

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {

	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;

.leaflet-pane         { z-index: 400; }

/* control positioning */

.leaflet-control {

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;

const normalizeText = value => String(value).normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
const STOP_TERMS = new Set(['파손', '고장', '불편', '문제', '발생', '신고', '수리', '위험', '시설', '보수', '교체', '계속']);

function characterFeatures(value) {
  const text = normalizeText(value), result = new Set();
  for (const width of [2, 3, 4]) {
    for (let i = 0; i <= text.length - width; i++) {
      const part = text.slice(i, i + width);
      if (!STOP_TERMS.has(part)) result.add(part);
    }
  }
  return result;
}

function jaccardSimilarity(a, b) {
  let intersection = 0;
  for (const item of a) if (b.has(item)) intersection++;
  const union = a.size + b.size - intersection;
  return union ? intersection / union : 0;
}

function cosineSimilarity(a, b) {
  let dot = 0, normA = 0, normB = 0;
  for (const [term, weight] of a) { normA += weight * weight; dot += weight * (b.get(term) || 0); }
  for (const weight of b.values()) normB += weight * weight;
  return normA && normB ? dot / Math.sqrt(normA * normB) : 0;
}

const indexes = new WeakMap();
function indexCategories(categories) {
  if (indexes.has(categories)) return indexes.get(categories);
  const documents = categories.map(category => {
    const terms = [...new Set(category.keywords)].filter(term => normalizeText(term).length >= 2);
    const features = new Set(terms.flatMap(term => [...characterFeatures(term)]));
    return { category, terms, features };
  });
  const df = new Map();
  for (const doc of documents) for (const feature of doc.features) df.set(feature, (df.get(feature) || 0) + 1);
  const idf = new Map([...df].map(([feature, count]) => [feature, 1 + Math.log((categories.length + 1) / (count + 1))]));
  for (const doc of documents) doc.vector = new Map([...doc.features].map(feature => [feature, idf.get(feature)]));
  const result = { documents, df, idf }; indexes.set(categories, result); return result;
}

function rankCategories(text, categories) {
  const query = normalizeText(text);
  if (query.length < 2 || !categories.length) return { candidates: [], best: 0, scores: [] };
  const { documents, df, idf } = indexCategories(categories);
  const features = characterFeatures(query);
  // As in a fitted TF-IDF vectorizer, out-of-vocabulary features are not dimensions.
  // The evidence gate below separately rejects generic or unrelated inputs.
  const vector = new Map([...features].filter(feature => idf.has(feature)).map(feature => [feature, idf.get(feature)]));
  const scores = documents.map(doc => {
    const matches = doc.terms.filter(term => query.includes(normalizeText(term)))
      .sort((a,b) => normalizeText(b).length - normalizeText(a).length)
      .filter((term, i, terms) => !terms.slice(0, i).some(longer => normalizeText(longer).includes(normalizeText(term))));
    const shared = [...features].filter(f => doc.features.has(f));
    const distinctive = shared.filter(f => f.length >= 3 && df.get(f) <= Math.max(1, categories.length / 3));
    const cosine = cosineSimilarity(vector, doc.vector);
    const jaccard = jaccardSimilarity(features, doc.features);
    // Compact specialist dictionaries need explicit evidence, not incidental n-grams.
    const supported = matches.length > 0 || (doc.terms.length > 20 && distinctive.length >= 2 && shared.length >= 4);
    return { category: doc.category, matches, evidence: matches.length ? matches.slice(0, 3) : distinctive.sort((a,b) => b.length - a.length).slice(0, 3), cosine, jaccard, score: 0.7 * cosine + 0.3 * jaccard, supported };
  }).sort((a,b) => b.score - a.score || a.category.id.localeCompare(b.category.id));
  const eligible = scores.filter(item => item.supported && item.score >= 0.025);
  const best = eligible[0]?.score || 0;
  const candidates = eligible.filter(item => item.score >= best * 0.45).slice(0, 3);
  for (const item of candidates) {
    if (!item.matches.length) item.evidence = item.category.keywords
      .map(term => ({ term, value: jaccardSimilarity(features, characterFeatures(term)) }))
      .sort((a,b) => b.value - a.value).slice(0, 2).map(entry => entry.term);
  }
  return { candidates, best, scores };
}

// Mirrors the DB RPC for the offline demo; missing coordinates never become (0, 0).
function mapSummary(items, categories, selection = {}) {
  const matching = items.filter(r => {
    const c = categories.find(c => c.id === r.category_id);
    return c && (!selection.main || c.main === selection.main)
      && (!selection.category || r.category_id === selection.category)
      && (!selection.status || r.status === selection.status);
  });

  for (const r of matching) {
    const d = districts.get(r.district) || { district: r.district, count: 0, located: 0 };
    d.count++;
    if (validCoordinates(r.latitude, r.longitude)) {

      const result = await client.rpc('report_map_data', { p_main: mapSelection.main || null, p_category: mapSelection.category || null, p_status: mapSelection.status || null });
      if (result.error) throw result.error;
      data = result.data;
    }
    if (token !== viewToken) return;
    const ranking = DISTRICTS.map(district => data.districts.find(d => d.district === district) || {district,count:0,located:0}).sort((a,b) => b.count - a.count);
    const largest = Math.max(1, ...ranking.map(d => Number(d.count)));
    const problem = cat(mapSelection.category)?.name || mapSelection.main || '모든 문제';
    $('#map-results').className = '';
    $('#map-results').removeAttribute('role');
    $('#map-results').innerHTML = `<p class="map-subtitle">${escapeHTML(problem)} · ${mapSelection.status === 'open' ? '미해결' : mapSelection.status === 'resolved' ? '작성자 해결 확인' : '전체 상태'} · 전체 기간${demo ? ' · 체험 데이터' : ''}</p><div class="map-metrics"><span>전체 제보<strong>${data.total}</strong></span><span>위치 등록<strong>${data.located}</strong></span><span>위치 미등록<strong>${data.total - data.located}</strong></span></div>${!data.located ? `<p class="map-empty">${data.total ? '아직 위치가 등록된 제보가 없습니다. 기존 제보는 아래 구별 건수에 포함됩니다.' : '선택한 조건의 제보가 없습니다.'}</p>` : ''}${data.truncated ? '<p class="map-empty">지도는 건수가 많은 5,000개 집계 지점만 표시합니다. 구별 건수와 전체 제보 수는 모든 기록을 포함합니다.</p>' : ''}<div class="map-dashboard"><section><div class="map-toolbar"><fieldset class="map-mode" aria-label="지도 표시 방식"><label><input type="radio" name="map-mode" value="heat" ${mapMode === 'heat' ? 'checked' : ''}>밀집도</label><label><input type="radio" name="map-mode" value="count" ${mapMode === 'count' ? 'checked' : ''}>지점별 건수</label></fieldset><button type="button" id="map-reset" class="icon secondary" title="대전 전체 보기" aria-label="대전 전체 보기">${icon('maximize')}</button></div><div id="heat-map" class="map-surface heat-surface" role="region" aria-label="문제별 제보 히트맵"></div><div class="map-legend" id="heat-legend"><span>낮은 밀집도</span><span class="heat-scale" aria-hidden="true"></span><span>높은 밀집도</span></div><p class="location-note">약 100m 단위로 모은 제보 위치입니다. 색은 현재 선택 조건과 확대 수준에서의 상대적 밀집도이며 위험도를 뜻하지 않습니다.</p></section><section class="map-ranking"><h2>구별 제보 건수</h2><p class="map-subtitle">${escapeHTML(problem)} · 대전 전체</p>${ranking.map(d => `<div class="map-rank"><div class="map-rank-head"><button type="button" data-map-district="${escapeHTML(d.district)}" title="${escapeHTML(d.district)} 지도 보기">${escapeHTML(d.district)}</button><strong>${d.count}건</strong></div><div class="track" role="img" aria-label="${escapeHTML(d.district)} ${d.count}건"><div class="bar" style="width:${100 * d.count / largest}%"></div></div><small>위치 등록 ${d.located} · 미등록 ${d.count - d.located}</small></div>`).join('')}</section></div><p class="notice">구별 건수는 작성자가 입력한 구를 기준으로 집계하며 위치가 없는 제보도 포함합니다. 인구·면적을 보정하지 않은 등록 건수로, 실제 지역 문제 전체나 위험도를 대표하지 않습니다.</p>`;
    try {
      heatView = showHeatMap($('#heat-map'), data); heatView.mode(mapMode);
      $('#heat-legend').hidden = mapMode !== 'heat';
      document.querySelectorAll('[name="map-mode"]').forEach(input => input.onchange = () => { mapMode = input.value; heatView.mode(mapMode); $('#heat-legend').hidden = mapMode !== 'heat'; });
      $('#map-reset').onclick = () => heatView.reset();
      document.querySelectorAll('[data-map-district]').forEach(button => button.onclick = () => heatView.district(button.dataset.mapDistrict));
    } catch (error) { $('#heat-map').textContent = error.message; $('#map-reset').disabled = true; }
    icons();
  } catch (error) {
    if (token !== viewToken) return;
    $('#map-results').className = 'error-box'; $('#map-results').textContent = `지도 통계를 불러오지 못했습니다. ${error.message} 위 새로고침 버튼으로 다시 시도해 주세요.`;
  }
}
$('#account').onclick = async () => {
  if (demo) { toast('체험 모드에서는 회원가입 없이 내 제보를 기록할 수 있어요.'); return; }
  if (!user) { $('#auth').showModal(); return; }
  try {
    const result = await client.auth.signOut(); if (result.error) throw result.error;
    user = null; updateAccount(); await render();
  } catch (error) { toast(authError(error)); }
};
let signupMode = false;
let resetRequestAt = 0;
const forgotButton = document.createElement('button');
forgotButton.type = 'button'; forgotButton.id = 'forgot-password'; forgotButton.className = 'quiet'; forgotButton.textContent = '비밀번호 찾기';
$('#auth-form .actions').append(forgotButton);
forgotButton.onclick = async () => {
  const form = $('#auth-form');
  if (!form.email.reportValidity()) return;
  if (Date.now() - resetRequestAt < 60000) { $('#auth-message').textContent = '메일을 요청한 뒤 1분 후 다시 시도해 주세요.'; return; }
  const buttons = form.querySelectorAll('button'); buttons.forEach(b => b.disabled = true);
  try {
    if (!client) throw new Error('온라인 사이트에서 다시 시도해 주세요.');
    const result = await client.auth.resetPasswordForEmail(form.email.value.trim(), { redirectTo: location.origin });
    if (result.error) throw result.error;
    resetRequestAt = Date.now();
    $('#auth-message').textContent = '재설정 메일을 요청했습니다. 가입된 이메일이라면 받은편지함과 스팸함을 확인해 주세요. 메일의 링크에서 새 비밀번호를 설정할 수 있습니다.';
  } catch (error) { $('#auth-message').textContent = authError(error); }
  finally { buttons.forEach(b => b.disabled = false); }
};
function openPasswordReset() {
  $('#auth').close();
  if (!$('#password-reset').open) $('#password-reset').showModal();
}
$('#password-reset-form').onsubmit = async event => {
  event.preventDefault();
  const form = event.target;
  if (!form.reportValidity()) return;
  if (form.newPassword.value !== form.repeatPassword.value) { $('#reset-message').textContent = '비밀번호가 서로 다릅니다.'; return; }
  const buttons = form.querySelectorAll('button'); buttons.forEach(b => b.disabled = true);
  $('#reset-message').textContent = '';
  try {
    if (!client || !user) throw new Error('재설정 링크가 만료되었습니다. 비밀번호 찾기에서 새 메일을 요청해 주세요.');
    const result = await client.auth.updateUser({ password: form.newPassword.value });
    if (result.error) throw result.error;
    try { sessionStorage.removeItem('password-recovery'); } catch { /* Storage may be restricted. */ }
    form.reset(); $('#password-reset').close(); toast('비밀번호를 변경했습니다. 다음 로그인부터 새 비밀번호를 사용해 주세요.');
  } catch (error) { $('#reset-message').textContent = authError(error); }
  finally { buttons.forEach(b => b.disabled = false); }
};
$('#password-reset').addEventListener('close', () => { $('#password-reset-form').reset(); $('#reset-message').textContent = ''; });
function authError(error) {
  const messages = {
    invalid_credentials: '이메일 또는 비밀번호를 확인해 주세요.',
    email_not_confirmed: '이메일 인증이 필요합니다. 받은편지함과 스팸함을 확인해 주세요.',
    user_already_exists: '이미 가입된 이메일입니다. 로그인해 주세요.',
    weak_password: '비밀번호가 보안 조건에 맞지 않습니다. 더 긴 비밀번호를 사용해 주세요.',
    over_email_send_rate_limit: '메일 요청이 많습니다. 잠시 후 다시 시도해 주세요.',
    over_request_rate_limit: '요청이 많습니다. 잠시 후 다시 시도해 주세요.',
    email_address_not_authorized: '현재 인증 메일 발송 대상이 제한되어 있습니다. 사이트 관리자에게 메일 발송 설정을 요청해 주세요.'
  };
  return messages[error.code] || (error instanceof TypeError ? '네트워크 연결을 확인한 뒤 다시 시도해 주세요.' : `요청 실패: ${error.message}`);
}
function setAuthMode(signup) {
  signupMode = signup;
  const form = $('#auth-form');
  $('#auth-title').textContent = signup ? '동네기록 회원가입' : '동네기록 로그인';
  $('#auth-submit').textContent = signup ? '회원가입' : '로그인';
  $('#signup').textContent = signup ? '로그인으로 돌아가기' : '회원가입';
  $('#confirm-label').hidden = !signup;
  form.confirm.required = signup;
  form.password.minLength = signup ? 8 : 1;
  form.password.autocomplete = signup ? 'new-password' : 'current-password';
  form.password.value = ''; form.confirm.value = '';
  $('#auth-message').textContent = '';
}
async function authenticate(signup) {
  const form = $('#auth-form'); if (!form.reportValidity()) return;
  if (signup && form.password.value !== form.confirm.value) { $('#auth-message').textContent = '비밀번호가 서로 다릅니다.'; return; }
  $('#auth-message').textContent = ''; const buttons = form.querySelectorAll('button'); buttons.forEach(b => b.disabled = true);
  try {
    if (!client) throw new Error('Supabase 연결 설정을 확인해 주세요.');
    const credentials = { email: form.email.value.trim(), password: form.password.value };
    const result = signup ? await client.auth.signUp({ ...credentials, options: { emailRedirectTo: location.origin } }) : await client.auth.signInWithPassword(credentials);
    if (result.error) throw result.error;
    if (signup && !result.data.session) { setAuthMode(false); $('#auth-message').textContent = '가입 요청을 처리했습니다. 인증 메일이 도착하면 링크를 눌러 주세요. 이미 가입했다면 로그인해 주세요.'; return; }
    user = result.data.user; form.reset(); $('#auth').close(); updateAccount(); toast('로그인했습니다.'); if (pageName() === 'mine') render();
  } catch (error) { $('#auth-message').textContent = authError(error); }
  finally { buttons.forEach(b => b.disabled = false); }
}
$('#auth-form').onsubmit = event => { event.preventDefault(); authenticate(signupMode); };
$('#signup').onclick = () => setAuthMode(!signupMode);
$('#resend').onclick = async () => {
  const form = $('#auth-form'); if (!form.email.reportValidity()) return;
  const buttons = form.querySelectorAll('button'); buttons.forEach(b => b.disabled = true);
  try {
    if (!client) throw new Error('Supabase 연결 설정을 확인해 주세요.');
    const result = await client.auth.resend({ type: 'signup', email: form.email.value.trim(), options: { emailRedirectTo: location.origin } });
    if (result.error) throw result.error;
    $('#auth-message').textContent = '재전송을 요청했습니다. 인증 대기 중인 계정이라면 받은편지함과 스팸함을 확인해 주세요.';
  } catch (error) { $('#auth-message').textContent = authError(error); }
  finally { buttons.forEach(b => b.disabled = false); }
};
$('#auth').addEventListener('close', () => { $('#auth-form').password.value = ''; $('#auth-form').confirm.value = ''; });
document.addEventListener('click', event => { const close = event.target.closest('[data-close]'); if (close) document.getElementById(close.dataset.close).close(); });
window.addEventListener('hashchange', () => { page = 0; render(); });
init();
</script></body>
