<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#137864">
  <meta name="description" content="대전의 생활불편을 기록하고, 우리 동네 현황과 민원 안내를 확인하세요.">
  <title>동네기록 | 대전 생활불편</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/recommendations.css">
  <script src="/config.js"></script>
  <script defer src="/vendor/supabase.js"></script>
  <script defer src="/vendor/lucide.js"></script>
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header class="topbar"><a href="#report" class="brand"><i data-lucide="map-pin-house"></i>동네기록<span>대전</span></a><button id="account" class="quiet"><i data-lucide="user-round"></i><span>로그인</span></button></header>
  <div id="mode" class="mode" role="status"></div>
  <div class="shell">
    <aside><nav aria-label="주 메뉴">
      <a href="#report" data-page="report"><i data-lucide="square-pen"></i>생활불편 제보</a>
      <a href="#board" data-page="board"><i data-lucide="list"></i>우리 동네 게시판</a>
      <a href="#stats" data-page="stats"><i data-lucide="chart-no-axes-combined"></i>지역 통계</a>
      <a href="#mine" data-page="mine"><i data-lucide="notebook-pen"></i>내 제보</a>
    </nav><div class="sidebar-bottom"><span class="dot"></span>대전광역시 생활불편 기록<br><small>시민이 남긴 제보를 모읍니다.</small></div></aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <footer>동네기록 · 정보과학 프로젝트 <span>사이트 등록은 행정기관에 대한 공식 신고가 아닙니다.</span></footer>
  <dialog id="detail"><div id="detail-content"></div></dialog>
  <dialog id="auth"><form id="auth-form"><div class="dialog-head"><h2>동네기록 로그인</h2><button type="button" class="icon" data-close="auth" aria-label="닫기"><i data-lucide="x"></i></button></div><p>내 제보와 해결 여부를 기록하세요.</p><label>이메일<input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label>비밀번호<input name="password" type="password" minlength="8" autocomplete="current-password" required placeholder="8자 이상"></label><p id="auth-message" role="status"></p><div class="actions"><button class="primary" type="submit">로그인</button><button type="button" id="signup" class="secondary">회원가입</button></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
